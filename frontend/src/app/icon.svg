<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mark Six Lab：金色的「6」號碼球（和頁面左上角的 BrandLogo 一致） -->
  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="0.45" stop-color="#F4B63F"/>
      <stop offset="1" stop-color="#B9811C"/>
    </radialGradient>
  </defs>
  <!-- 球；深金色外框讓淺色分頁列上也看得清楚 -->
  <circle cx="32" cy="32" r="30" fill="url(#ball)" stroke="#8A5E12" stroke-width="2"/>
  <!-- 「6」用路徑畫（SVG favicon 載入不了網頁字體）：下方的圈 + 往右上彎的筆畫 -->
  <g fill="none" stroke="#2A1C03" stroke-width="7" stroke-linecap="round">
    <ellipse cx="32" cy="39" rx="8" ry="9"/>
    <path d="M24 39 C24 25 28.5 17.5 39 16.5"/>
  </g>
</svg>
