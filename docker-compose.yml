# 本機開發用的基礎設施：MongoDB（單節點副本集）+ Redis
# 啟動：docker compose up -d     停止：docker compose down     清空數據：docker compose down -v
#
# 埠號刻意避開本機已安裝的 MongoDB(27017) / Redis(6379)：
#   MongoDB → 27018，Redis → 6380

name: thirty-lab

services:
  mongodb:
    image: mongo:8.0
    container_name: tl-mongodb
    # --replSet：以副本集模式啟動，才支援多文件事務（積分、注單、流水要在同一個事務裡寫）
    # --port 27018：容器內外用同一個埠，副本集成員位址 localhost:27018 在兩邊都有效
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongodb-data:/data/db
    # 健康檢查兼初始化：第一次啟動時副本集還沒建立，rs.status() 會失敗 → 執行 rs.initiate()
    healthcheck:
      test: >
        mongosh --port 27018 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: tl-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb-data:
  redis-data:
