# Render \u4E0A\u555F\u7528\uFF1ASPRING_PROFILES_ACTIVE=cloud
# \u672C\u6A5F\u4E0D\u8981\u958B\u9019\u500B profile\uFF0C\u5426\u5247\u6703\u53BB\u9023 Upstash \u800C\u4E0D\u662F Docker \u88E1\u7684 Redis
#
# Upstash \u5FC5\u9808\u8D70 TLS\u3002\u5E33\u865F\u56FA\u5B9A\u662F default\uFF0C\u5BC6\u78BC\u53EA\u653E\u74B0\u5883\u8B8A\u6578\uFF0C\u4E0D\u8981\u5BEB\u9032\u6A94\u6848
spring.data.redis.ssl.enabled=true
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5s

# \u514D\u8CBB\u6A5F\u5668\u53EA\u6709 512 MB\u30010.1 CPU\uFF0CDEBUG \u65E5\u8A8C\u6703\u62D6\u6162\u958B\u734E
logging.level.com.thirtylab=INFO

# \u5065\u5EB7\u6AA2\u67E5\u7DB2\u5740\u662F\u516C\u958B\u7684\uFF0C\u4E0D\u8981\u5217\u51FA\u8CC7\u6599\u5EAB\u9023\u7DDA\u7D30\u7BC0
management.endpoint.health.show-details=never
