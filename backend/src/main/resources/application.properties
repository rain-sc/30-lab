spring.application.name=mark-six-lab-backend

# ===== 服務 =====
# 用 8088（不用 8080），避免和其他本機項目衝突；前端 next.config.ts 的 rewrites 指向這裡
server.port=${SERVER_PORT:8088}

# ===== MongoDB =====
# Docker Compose 裡的單節點副本集（埠 27018）。副本集才支援多文件事務（積分扣款 + 注單 + 流水要在同一個事務）
# directConnection=true：直接連這個節點，不做副本集成員發現（本機開發用）
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/marksixlab?directConnection=true}
spring.data.mongodb.auto-index-creation=true

# ===== Redis =====
# Docker Compose 裡的 Redis（埠 6380），用於快取、排行榜、分散式鎖、限流
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# ===== 遊戲規則（見 docs/game-rules.md）=====
# 每期間隔：5 分鐘一期
app.game.draw-interval=5m
# 開獎前多久停止下注
app.game.betting-cutoff=15s
# 每注積分
app.game.points-per-bet=10

# ===== 前端 =====
# 允許跨域的前端來源（WebSocket 直連後端時需要）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3100}

# ===== API 文件 =====
# Swagger UI：http://localhost:8088/swagger-ui.html
# OpenAPI JSON：http://localhost:8088/v3/api-docs（匯出到 docs/api/openapi.json 給前端生成 TypeScript 類型）
springdoc.swagger-ui.operations-sorter=method

# ===== Actuator =====
# 健康檢查：http://localhost:8088/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== 日誌 =====
logging.level.com.marksixlab=DEBUG
# Windows 系統地區是英文時，控制台中文會變成 ????，強制 UTF-8
logging.charset.console=UTF-8

# ===== ?? =====
# JWT ?????HS256 ?? 32 bytes?????????????? JWT_SECRET ??
app.auth.jwt-secret=${JWT_SECRET:dev-only-secret-please-change-me-0123456789}
# ??????JWT?cookie?Redis session ???
app.auth.token-ttl=7d
app.auth.cookie-name=msl_token
# ??? http???? Secure cookie??????https??? true
app.auth.cookie-secure=${COOKIE_SECURE:false}
